name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    attributes: {label: Description, description: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    attributes: {label: AgroClim-F version}
    validations: {required: true}
  - type: textarea
    attributes: {label: Reproduction, description: Provide the command and minimal non-confidential input.}
    validations: {required: true}
  - type: textarea
    attributes: {label: Environment, description: OS, compiler, compiler version, and build system.}
    validations: {required: true}
