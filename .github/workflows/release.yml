name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        with: {compiler: gcc, version: latest}
      - name: Validate release commit
        run: make test
      - name: Build release executable and checksums
        run: |
          make release
          mkdir -p dist
          cp build/agroclim "dist/agroclim-linux-x86_64"
          sha256sum dist/agroclim-linux-x86_64 > dist/SHA256SUMS
      - name: Create GitHub release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
